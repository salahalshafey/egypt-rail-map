<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egypt rail map – every ENR train and station</title>
<meta name="description" content="Interactive map of every Egyptian National Railways train and station: departures, trip planner and estimated train positions from the timetable.">
<meta property="og:title" content="Egypt rail map">
<meta property="og:description" content="Every ENR train and station on one map, with departures, a trip planner and estimated train positions.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --land:#F2F3EE; --outside:#E2E7EA; --border:#C9CEC7; --track:#1D4E9E; --track-soft:#8FA6CC;
  --signal:#C4122F; --ink:#16202A; --muted:#5C6B78; --line:#DDE1E4; --panel:#FFFFFF; --panel-2:#F5F7F8;
  --chip:#EAEEF2; --chip-on:#1D4E9E; --chip-on-ink:#FFFFFF; --halo:rgba(255,255,255,.9); --next:#FFF3D6; --live:#E07800; --live-ink:#9A4F00;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --land:#1F262B; --outside:#141A1E; --border:#36414A; --track:#6F9BEA; --track-soft:#3D5480;
  --signal:#FF5A6E; --ink:#E7ECEF; --muted:#98A6B2; --line:#2C353C; --panel:#182025; --panel-2:#1D262C;
  --chip:#26313A; --chip-on:#6F9BEA; --chip-on-ink:#0F1418; --halo:rgba(20,26,30,.85); --next:#3A3220; --live:#FFA126; --live-ink:#FFC170; color-scheme:dark;}}
:root[data-theme="dark"]{
  --land:#1F262B; --outside:#141A1E; --border:#36414A; --track:#6F9BEA; --track-soft:#3D5480;
  --signal:#FF5A6E; --ink:#E7ECEF; --muted:#98A6B2; --line:#2C353C; --panel:#182025; --panel-2:#1D262C;
  --chip:#26313A; --chip-on:#6F9BEA; --chip-on-ink:#0F1418; --halo:rgba(20,26,30,.85); --next:#3A3220; --live:#FFA126; --live-ink:#FFC170; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--panel);color:var(--ink);
  font:15px/1.45 "IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;font-feature-settings:"tnum" 1}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:400px 1fr;height:100%}
aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.top{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 12px;color:var(--muted);font-size:13px}
.search{position:relative}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);outline:none}
.search input:focus{border-color:var(--track);box-shadow:0 0 0 3px color-mix(in srgb,var(--track) 22%,transparent)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:20;max-height:320px;overflow:auto;display:none}
.sugg.on{display:block}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer}
.sugg button:hover,.sugg button.act{background:var(--panel-2)}
.sugg .k{color:var(--muted);font-size:12px}
.body{flex:1;overflow:auto;padding:16px 20px 28px}
.crumb{border:0;background:none;color:var(--track);padding:0;margin:0 0 10px;cursor:pointer;font-weight:500}
span.ar:not(.nm){unicode-bidi:isolate;direction:rtl}
.tl .nm{text-align:left}
.ar{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif}
.title-ar{font-size:30px;font-weight:700;line-height:1.15;margin:0;direction:rtl;text-align:left}
.title-en{margin:2px 0 0;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--panel-2);border-left:3px solid var(--border);padding:8px 10px;border-radius:0 6px 6px 0;margin:10px 0}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 8px}
.chip{border:0;background:var(--chip);padding:5px 10px;border-radius:999px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.row:hover{background:var(--panel-2)}
.row.next{background:var(--next)}
.row .t{font-weight:600;font-size:16px}
.row .d{min-width:0}
.row .d .main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d .meta{font-size:12px;color:var(--muted)}
.row .n{font-size:13px;color:var(--muted);text-align:right}
.row:focus-visible,.chip:focus-visible,.crumb:focus-visible,button:focus-visible{outline:2px solid var(--track);outline-offset:2px}
.empty{color:var(--muted);padding:14px 0}
h2{font-size:14px;font-weight:600;margin:20px 0 8px}
.plan{display:grid;gap:8px}
.plan .swap{justify-self:start;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.go{border:0;background:var(--track);color:var(--chip-on-ink);padding:10px;border-radius:8px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
/* train timeline */
.tl{list-style:none;margin:8px 0 0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;padding:6px 0;cursor:pointer;align-items:center}
.tl li .dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--signal);background:var(--panel);justify-self:center;position:relative;z-index:1}
.tl li.end .dot{background:var(--signal)}
.tl::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:3px;background:var(--signal);opacity:.35;border-radius:2px}
.tl li:hover .nm{text-decoration:underline}
.tl .nm{font-weight:500}
.tl .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tl .tm{text-align:right;font-size:13px;white-space:nowrap}
.tl .tm .p1{color:var(--signal);font-size:11px;margin-left:2px}
.home-list .row{grid-template-columns:1fr auto}
.dl li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl a{color:var(--track);font-weight:500;margin-right:8px}
.dl span{color:var(--muted);font-size:12px;text-align:right}
/* map */
.map{position:relative;min-height:0;background:var(--outside);overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
.ctrl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.ctrl .lang{font-size:13px;font-weight:600}
.legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;white-space:nowrap}
.credit{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);background:var(--halo);padding:2px 6px;border-radius:4px}

.livebar{position:absolute;left:14px;top:14px;right:66px;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.lb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lb-dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 2s infinite}
.livebar.paused .lb-dot{animation:none;background:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.lb-time{font-weight:600}
.lb-count{color:var(--muted)}
.lb-btn{margin-left:auto;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px}
.lb-scrub{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:8px}
.lb-scrub[hidden]{display:none}
.lb-scrub select{font:inherit;font-size:12px;padding:3px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2)}
.lb-scrub input{width:100%;accent-color:var(--live)}
.lb-note{grid-column:1/-1;color:var(--muted);font-size:11px}
.live-now{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--panel-2);margin:10px 0;color:var(--muted)}
.live-now.on{background:color-mix(in srgb,var(--live) 14%,var(--panel));color:var(--ink)}
.live-now .lc-head{margin-bottom:8px}
.lc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:8px 0}
.lc-grid div{display:flex;flex-direction:column}
.lc-grid>div>span{font-size:11px;color:var(--muted)}
.lc-grid b{font-size:16px;font-weight:600;color:var(--ink)}
.lc-grid small{font-size:12px;color:var(--muted)}
.lc-line{font-size:12.5px;margin:6px 0}
.lc-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.lc-bar i{display:block;height:100%;background:var(--live)}
.lc-km{display:flex;justify-content:space-between;color:var(--muted);margin-top:4px}
.lc-up{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.lc-up th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:2px 0}
.lc-up td{padding:3px 0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.lc-up td:nth-child(n+2),.lc-up th:nth-child(n+2){text-align:right}
.lc-how{font-size:11px;color:var(--muted);margin:10px 0 0}
.tip{white-space:normal;max-width:300px}
.tl li.passed{opacity:.5}
.tl li.here .dot{background:var(--live);border-color:var(--live)}
@media (prefers-reduced-motion:reduce){.lb-dot{animation:none}}
@media (max-width:820px){.livebar{left:8px;top:8px;right:56px;padding:6px 8px}.lb-count{display:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:46% 54%}
  .map{order:1;grid-row:1}
  aside{order:2;grid-row:2;border-right:0;border-top:1px solid var(--line)}
  .top{padding:12px 16px 10px} .body{padding:12px 16px 24px}
  .legend{display:none} .title-ar{font-size:26px} .sub{display:none} h1{font-size:17px;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

  S.forEach((s,i)=>{const na=normAr(s[0]),ne=normEn(s[1]);let sc=null;
    if(a&&na.startsWith(a))sc=0;else if(e&&ne.startsWith(e))sc=0;else if(a&&na.includes(a))sc=1;else if(e.length>1&&ne.includes(e))sc=1;

  if($('jump'))$('jump').onclick=()=>{const el=panel.querySelectorAll('.row')[nextIdx];el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});el.focus({preventScroll:true})};
  if(located[si]){const x=px(s),y=py(s),r=.35;fit([x-r,y-r,x+r,y+r])}else draw();
}
window.setBoardDay=d=>{boardDay=d;const h=location.hash.slice(1);if(h.startsWith('s-'))viewStation(byId[+h.slice(2)],d);else if(h.startsWith('trip-'))route()};
function viewTrain(ti){
  sel={station:null,train:ti,trip:null};
  const t=T[ti],st=t[9],o=st[0][0],d=st.at(-1)[0];
  const dep=st[0][2],arr=st.at(-1)[1];
  const days=t[5]===-1?'Special – runs on instruction':t[6];
  panel.innerHTML=back+`
  <h2 style="font-size:26px;margin:0;font-weight:700">Train ${esc(t[0])}</h2>
  <p class="title-en"><span class="ar">${esc(stName(o))}</span> to <span class="ar">${esc(stName(d))}</span></p>
  <div class="facts"><span><b>${hm(dep)}</b> – <b>${hm(arr)}</b>${arr>=1440?' next day':''}</span><span><b>${dur(t[3])}</b></span>${t[4]?`<span><b>${t[4]} km</b></span>`:''}<span><b>${st.length}</b> stops</span><span>${esc(C[t[1]][1])} <span class="ar">(${esc(C[t[1]][0])})</span></span></div>
  <div class="live-now" id="liveNow"></div>
  <p class="note" style="border-left-color:var(--signal)">${esc(days)}${t[7]?`<br><span class="ar" dir="rtl">${esc(t[7])}</span>`:''}</p>
  <ol class="tl">${st.map((s,i)=>{const end=i===0||i===st.length-1;const a=s[1],dd=s[2];
    const tm=i===0?`dep <b>${hm(dd)}</b>`:i===st.length-1?`arr <b>${hm(a)}</b>${a>=1440?'<span class="p1">+1</span>':''}`:`${hm(a)} – <b>${hm(dd)}</b>${dd>=1440?'<span class="p1">+1</span>':''}`;
    return `<li class="${end?'end':''}" tabindex="0" data-s="${S[s[0]][8]}"><span class="dot"></span><span class="nm ar">${esc(S[s[0]][0])}<small>${esc(S[s[0]][1])}${located[s[0]]?'':' · not on map'}</small></span><span class="tm">${tm}</span></li>`}).join('')}</ol>`;
  bindRows();panel.scrollTop=0;updateLiveText();fit(bbox(st.map(s=>s[0])),50);
}
function viewTrip(a,b,day){
  sel={station:null,train:null,trip:{a,b}};
  const res=[];
  calls[a].forEach(([ti,k])=>{const t=T[ti];const j=t[9].findIndex((s,n)=>n>k&&s[0]===b);if(j<0)return;const m=t[9][k][2];if(m<0)return;
    if(!callRuns(t,m,day))return;res.push({ti,dep:m,arr:t[9][j][1],stops:j-k})});
  res.sort((x,y)=>(x.dep%1440)-(y.dep%1440));
  const now=cairoNow();const nx=day===now.day?res.findIndex(r=>r.dep%1440>=now.min):-1;
  panel.innerHTML=back+`
  <h2 style="font-size:22px;margin:0;font-weight:700"><span class="ar">${esc(S[a][0])}</span> to <span class="ar">${esc(S[b][0])}</span></h2>
  <p class="title-en">${esc(S[a][1])} to ${esc(S[b][1])}</p>
  ${dayChips(day,'setBoardDay')}
  ${res.length?`<ul class="rows">${res.map((r,n)=>{const t=T[r.ti];return `<li class="row${n===nx?' next':''}" tabindex="0" data-t="${t[8]}"><span class="t">${hm(r.dep)}</span><div class="d"><div class="main">arrives ${hm(r.arr)}${Math.floor(r.arr/1440)>Math.floor(r.dep/1440)?' next day':''}</div><div class="meta">${dur(r.arr-r.dep)} · ${r.stops} stop${r.stops>1?'s':''} · ${esc(C[t[1]][1])}</div></div><span class="n">${esc(t[0])}</span></li>`}).join('')}</ul>`
  :`<p class="empty">No direct train runs between these stations on ${DAYN[day]}. Try another day, or travel via a bigger station such as Cairo, Tanta or Banha.</p>`}`;
  bindRows();panel.scrollTop=0;fit(bbox([a,b]),80);
}
/* ---------- live (timetable-estimated) train positions ---------- */
const clock={live:true,day:0,min:0};
function cairoPrecise(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;
  return {day:DAYN.indexOf(g('weekday')),min:+g('hour')*60+ +g('minute')+ +g('second')/60};
}
function clockNow(){return clock.live?cairoPrecise():{day:clock.day,min:clock.min}}
const LEG={};
const DEG_KM=111.32, ACC=0.25; // m/s², typical for ENR loco-hauled trains
// Speed profile for one leg: accelerate at ACC, cruise, brake at ACC, so that distance D (m) is covered in exactly T (s).
function profile(D,T){
  if(T<=0||D<=0)return {a:1,v:D/Math.max(T,1),T,D,lin:true};
  const a=Math.max(ACC,4*D/(T*T)*1.0001), v=(a*T-Math.sqrt(Math.max(0,a*a*T*T-4*a*D)))/2;
  return {a,v,T,D};
}
function sAt(P,t){ // metres covered t seconds after departure
  if(P.lin)return Math.min(P.D,P.v*t);
  const ta=P.v/P.a;
  if(t<=ta)return .5*P.a*t*t;
  if(t<=P.T-ta)return P.v*ta/2+P.v*(t-ta);
  const r=P.T-t;return P.D-.5*P.a*r*r;
}
function vAt(P,t){if(P.lin)return P.v;const ta=P.v/P.a;return t<=ta?P.a*t:t<=P.T-ta?P.v:P.a*Math.max(0,P.T-t)}
function tAt(P,s){ // seconds after departure when distance s (m) is reached
  if(P.lin)return s/P.v;
  const ta=P.v/P.a,sa=P.v*ta/2;
  if(s<=sa)return Math.sqrt(2*s/P.a);
  if(s<=P.D-sa)return ta+(s-sa)/P.v;
  return P.T-Math.sqrt(2*Math.max(0,P.D-s)/P.a);
}
function legs(ti){
  if(LEG[ti])return LEG[ti];
  const loc=T[ti][9].map((s,k)=>({k,i:s[0],a:s[1]<0?s[2]:s[1],d:s[2]<0?s[1]:s[2],km:s[3]})).filter(x=>located[x.i]);
  const L=[];let off=0;
  for(let j=1;j<loc.length;j++){
    const A=loc[j-1],B=loc[j],nodes=shortest(A.i,B.i),p=nodes.map(n=>[px(S[n]),py(S[n])]),cum=[0];
    for(let q=1;q<p.length;q++)cum.push(cum[q-1]+Math.hypot(p[q][0]-p[q-1][0],p[q][1]-p[q-1][1]));
    const geoKm=cum.at(-1)*DEG_KM, trackKm=(A.km>=0&&B.km>=0)?Math.abs(B.km-A.km):-1;
    const useTrack=trackKm>0&&trackKm>=geoKm*0.9&&trackKm<=geoKm*1.8+2;
    const km=useTrack?trackKm:geoKm*1.05;
    const P=profile(km*1000,(B.a-A.d)*60);
    // stations passed without stopping, with their share of the leg
    const pass=nodes.slice(1,-1).map((n,q)=>({i:n,f:cum[q+1]/(cum.at(-1)||1)}));
    L.push({p,cum,km,P,pass,off,src:useTrack?'track':'map'});off+=km;
  }
  return LEG[ti]={loc,L,total:off};
}
// position of train ti at minute m (minutes since its origin day's midnight)
function posAt(ti,m){
  const {loc,L,total}=legs(ti);if(loc.length<2)return null;
  if(m<loc[0].d||m>loc.at(-1).a)return null;
  for(let j=0;j<loc.length;j++){
    const s=loc[j];
    if(m>=s.a&&m<=s.d)return {x:px(S[s.i]),y:py(S[s.i]),moving:false,at:s.i,k:s.k,j,until:s.d,last:j===loc.length-1,first:j===0,m,
      covered:j?L[j-1].off+L[j-1].km:0,total,speed:0};
    if(j<loc.length-1&&m>s.d&&m<loc[j+1].a){
      if(loc[j+1].a-s.d>300)return null; // timetable gap too long to trust
      const n=loc[j+1],lg=L[j],t=(m-s.d)*60,sm=sAt(lg.P,t),f=lg.P.D?sm/lg.P.D:0;
      const {p,cum}=lg,tot=cum.at(-1)||1e-9,target=f*tot;
      let q=1;while(q<cum.length-1&&cum[q]<target)q++;
      const seg=cum[q]-cum[q-1]||1e-9,g=(target-cum[q-1])/seg;
      const x=p[q-1][0]+(p[q][0]-p[q-1][0])*g,y=p[q-1][1]+(p[q][1]-p[q-1][1])*g;
      const nx=lg.pass.find(o=>o.f>f+1e-6);
      return {x,y,moving:true,from:s.i,to:n.i,kFrom:s.k,kTo:n.k,j,eta:n.a,m,ang:Math.atan2(p[q][1]-p[q-1][1],p[q][0]-p[q-1][0]),
        speed:vAt(lg.P,t)*3.6,cruise:lg.P.v*3.6,toNext:lg.km*(1-f),legKm:lg.km,src:lg.src,
        covered:lg.off+lg.km*f,total,
        passNext:nx?{i:nx.i,km:lg.km*(nx.f-f),eta:s.d+tAt(lg.P,nx.f*lg.P.D)/60}:null};
    }
  }
  return null;
}
// all trains on the line at clock time; checks trips that began today or yesterday
function liveTrains(){
  const c=clockNow(),out=[];
  T.forEach((t,ti)=>{
    if(t[5]===-1)return; // special services run only on instruction
    for(const back of [0,1]){
      if(!runsOn(t,c.day-back))continue;
      const m=c.min+back*1440,p=posAt(ti,m);
      if(p){p.ti=ti;p.m=m;out.push(p);break}
    }
  });
  return out;
}
let LIVE=[];
function liveTick(){LIVE=liveTrains();draw();updateLiveBar();updateLiveText()}
function trainScreen(p){return [view.x+view.s*p.x,view.y+view.s*p.y]}
function drawTrains(){
  const z=view.s,r=Math.max(3,Math.min(7,z/140));
  const selP=LIVE.find(p=>p.ti===sel.train);
  for(const p of LIVE){
    if(p.ti===sel.train)continue;
    drawTrainMarker(p,r,col['--live'],false);
  }
  if(selP)drawTrainMarker(selP,r*1.5,col['--signal'],true);
  if(z>900||selP){
    ctx.font=`600 11px "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif`;ctx.textBaseline='middle';
    const tb=[];
    for(const p of (z>900?[selP,...LIVE].filter(Boolean):[selP])){const [x,y]=trainScreen(p);if(x<0||y<0||x>W||y>H)continue;
      const txt=T[p.ti][0],w=ctx.measureText(txt).width,tx=x-w/2,ty=y-r*(p.ti===sel.train?1.5:1)-9,bx=[tx-2,ty-7,tx+w+2,ty+7];
      if(p.ti!==sel.train&&tb.some(o=>!(bx[2]<o[0]||bx[0]>o[2]||bx[3]<o[1]||bx[1]>o[3])))continue;tb.push(bx);
      ctx.lineWidth=3;ctx.strokeStyle=col['--halo'];ctx.strokeText(txt,tx,ty);ctx.fillStyle=p.ti===sel.train?col['--signal']:col['--live-ink'];ctx.fillText(txt,tx,ty)}
  }
}
function drawTrainMarker(p,r,fill,big){
  const [x,y]=trainScreen(p);if(x<-20||y<-20||x>W+20||y>H+20)return;
  ctx.save();ctx.translate(x,y);
  if(big){ctx.beginPath();ctx.arc(0,0,r*2.2,0,7);ctx.fillStyle=fill;ctx.globalAlpha=.18;ctx.fill();ctx.globalAlpha=1}
  if(p.moving){ctx.rotate(p.ang);ctx.beginPath();ctx.moveTo(r*1.6,0);ctx.lineTo(-r,r*1.05);ctx.lineTo(-r*.45,0);ctx.lineTo(-r,-r*1.05);ctx.closePath()}
  else{ctx.beginPath();ctx.rect(-r*.9,-r*.9,r*1.8,r*1.8)}
  ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle=col['--panel'];ctx.stroke();ctx.restore();
}
function nearestTrain(mx,my,max=12){let best=null,bd=max*max;for(const p of LIVE){const [x,y]=trainScreen(p),d=(x-mx)**2+(y-my)**2;if(d<bd){bd=d;best=p}}return best}
const kmf=v=>v<10?v.toFixed(1):Math.round(v).toString();
const inMin=v=>{v=Math.round(v);return v<=0?'now':v<60?`in ${v} min`:`in ${Math.floor(v/60)} h ${String(v%60).padStart(2,'0')} min`};
const nm=i=>`<span class="ar">${esc(stName(i))}</span>`;
function liveStatus(p){
  if(!p)return null;
  if(!p.moving){
    if(p.last)return `Arrived at ${nm(p.at)}`;
    if(p.first)return `Waiting to depart ${nm(p.at)} at ${hm(p.until)}`;
    return `Stopped at ${nm(p.at)}, departs ${hm(p.until)}`;
  }
  return `${p.cruise>160?'Moving':'About '+Math.round(p.speed)+' km/h'}, ${kmf(p.toNext)} km before ${nm(p.to)}`;
}
function liveCard(p){
  if(!p)return `Not running ${clock.live?'right now':'at '+hm(clock.min)+' on '+DAYLONG[clock.day]}.`;
  const {loc,L,total}=legs(p.ti);
  const head=clock.live?'Now':'At '+hm(clock.min);
  let html=`<div class="lc-head"><b>${head}:</b> ${liveStatus(p)}.</div>`;
  if(p.moving){
    html+=`<div class="lc-grid">
      <div><span>Next stop</span><b>${nm(p.to)}</b></div>
      <div><span>Arrives</span><b>${hm(p.eta)}</b><small>${inMin(p.eta-p.m)}</small></div>
      <div><span>Distance left</span><b>${kmf(p.toNext)} km</b><small>of ${kmf(p.legKm)} km</small></div>
      <div><span>Speed now</span><b>${p.cruise>160?'n/a':Math.round(p.speed)+' km/h'}</b><small>${p.cruise>160?'timetable too tight to model':'cruise '+Math.round(p.cruise)+' km/h'}</small></div></div>`;
    if(p.passNext)html+=`<div class="lc-line">Passes ${nm(p.passNext.i)} without stopping in ${kmf(p.passNext.km)} km, about ${hm(p.passNext.eta)}.</div>`;
  } else if(!p.last){
    html+=`<div class="lc-line">Departs ${inMin(p.until-p.m)}.</div>`;
  }
  const pct=Math.min(100,100*p.covered/(total||1));
  html+=`<div class="lc-bar" role="img" aria-label="${Math.round(pct)}% of the journey done"><i style="width:${pct}%"></i></div>
    <div class="lc-line lc-km"><span>${kmf(p.covered)} km done</span><span>${kmf(Math.max(0,total-p.covered))} km to go</span></div>`;
  // upcoming stops with ETA and distance from the train
  const startJ=p.moving?p.j+1:p.j+1, up=[];
  let dist=p.moving?p.toNext:0;
  for(let j=startJ;j<loc.length&&up.length<4;j++){
    if(!(p.moving&&j===p.j+1))dist+=L[j-1].km;
    up.push(`<tr><td>${nm(loc[j].i)}</td><td>${hm(loc[j].a)}</td><td>${inMin(loc[j].a-p.m)}</td><td>${kmf(dist)} km</td></tr>`);
  }
  if(up.length)html+=`<table class="lc-up"><thead><tr><th>Coming up</th><th>Arr</th><th></th><th>From train</th></tr></thead><tbody>${up.join('')}</tbody></table>`;
  html+=`<p class="lc-how">Estimated from the timetable times, the distance between stations along the track${p.moving&&p.src==='map'?' (measured on the map for this stretch)':''} and the current time, assuming the train runs on time and accelerates and brakes at ${ACC} m/s².</p>`;
  return html;
}
/* live bar */
const DAYLONG=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];
function fmtClock(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mi=Math.floor(m%60),s=Math.floor((m*60)%60);return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')+(clock.live?':'+String(s).padStart(2,'0'):'')}
function updateLiveBar(){
  const c=clockNow(),mv=LIVE.filter(p=>p.moving).length,st=LIVE.length-mv;
  $('lbTime').textContent=`${fmtClock(c.min)} ${DAYLONG[c.day]}`;
  $('lbMode').textContent=clock.live?'Live':'Timetable at';
  $('livebar').classList.toggle('paused',!clock.live);
  $('lbCount').textContent=`${mv} moving, ${st} at stations`;
  if(!clock.live){$('lbRange').value=Math.round(clock.min);$('lbDay').value=clock.day}
}
function setupLiveBar(){
  $('lbChange').onclick=()=>{const open=$('lbScrub').hidden;$('lbScrub').hidden=!open;$('lbChange').setAttribute('aria-expanded',open);
    if(open&&clock.live){const c=cairoPrecise();clock.day=c.day;clock.min=Math.floor(c.min)}};
  $('lbRange').oninput=e=>{clock.live=false;clock.min=+e.target.value;liveTick()};
  $('lbDay').onchange=e=>{clock.live=false;clock.day=+e.target.value;liveTick()};
  $('lbLive').onclick=()=>{clock.live=true;$('lbScrub').hidden=true;$('lbChange').setAttribute('aria-expanded','false');liveTick()};
  $('lbDay').innerHTML=DAYLONG.map((d,i)=>`<option value="${i}">${d}</option>`).join('');
}
/* live text in panels */
function updateLiveText(){
  const h=location.hash.slice(1);
  if(sel.train!=null&&$('liveNow')){
    const p=LIVE.find(q=>q.ti===sel.train);
    $('liveNow').innerHTML=liveCard(p);
    $('liveNow').classList.toggle('on',!!p);
    const items=panel.querySelectorAll('.tl li');
    items.forEach((li,i)=>{li.classList.remove('passed','here');if(!p)return;
      const kNow=p.moving?p.kTo:p.k;if(i<kNow||(!p.moving&&i<p.k))li.classList.add('passed');if(!p.moving&&i===p.k)li.classList.add('here')});
  }
  if($('liveList'))renderLiveList();
}
function renderLiveList(){
  const mv=[...LIVE].sort((a,b)=>(+T[a.ti][0].replace(/\D.*/,'')||0)-(+T[b.ti][0].replace(/\D.*/,'')||0));
  $('liveHead').textContent=`${LIVE.length} trains on the line ${clock.live?'now':'at '+hm(clock.min)+' on '+DAYLONG[clock.day]}`;
  $('liveList').innerHTML=mv.length?mv.map(p=>{const t=T[p.ti],o=t[9][0][0],d=t[9].at(-1)[0];
    return `<li class="row" tabindex="0" data-t="${t[8]}"><span class="t">${esc(t[0])}</span><div class="d"><div class="main"><span class="ar">${esc(stName(o))}</span> to <span class="ar">${esc(stName(d))}</span></div><div class="meta">${p.moving?'Next '+nm(p.to)+' '+hm(p.eta)+', '+kmf(p.toNext)+' km'+(p.cruise>160?'':', ~'+Math.round(p.speed)+' km/h'):liveStatus(p)}</div></div><span class="n">${esc(C[t[1]][1])}</span></li>`}).join('')
    :`<p class="empty">No trains are scheduled on the line at this time. Pick another time from the bar on the map.</p>`;
  bindRows();
}

/* ---------- routing ---------- */
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h; if(!h)history.replaceState(null,'',location.pathname+location.search)}
window.go=go;
function route(){
  const h=location.hash.slice(1);let m;
  if((m=h.match(/^s-(\d+)$/))&&byId[m[1]]!=null)viewStation(byId[m[1]],boardDay);
  else if((m=h.match(/^t-(\d+)$/))&&tById[m[1]]!=null)viewTrain(tById[m[1]]);
  else if((m=h.match(/^trip-(\d+)-(\d+)$/))&&byId[m[1]]!=null&&byId[m[2]]!=null)viewTrip(byId[m[1]],byId[m[2]],boardDay);
  else viewHome();
}
window.addEventListener('hashchange',route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readCols();draw()});
new ResizeObserver(resize).observe(wrap);
readCols();setupLiveBar();LIVE=liveTrains();resize();fit(ALL,40,false);route();updateLiveBar();
setInterval(()=>{if(clock.live)liveTick()},2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&clock.live)liveTick()});
</script>
